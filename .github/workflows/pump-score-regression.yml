name: Pump cold-build score regression
on:
  workflow_dispatch:
    inputs:
      base:
        description: Full base commit SHA in this repository
        required: true
      candidate:
        description: Full candidate commit SHA in this repository
        required: true
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - name: Validate immutable input revisions
        env:
          BASE: ${{ inputs.base }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          test "$(uname -m)" = x86_64
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the gate
        run: |
          python -B tooling/reconstruction/harness/test_compare_scores.py
          python -B tooling/reconstruction/harness/test_build_score_pair.py
      - name: Install and authenticate the pinned SDK
        run: |
          curl --fail --location --retry 3 https://github.com/anza-xyz/platform-tools/releases/download/v1.44/platform-tools-linux-x86_64.tar.bz2 -o "$RUNNER_TEMP/sdk.tar.bz2"
          echo "6719b889d60677a8a2fcf4c82f68441a1afe0ab093edd2efe9f84a67a808b3e9  $RUNNER_TEMP/sdk.tar.bz2" | sha256sum -c -
          mkdir -p "$HOME/.cache/solana/v1.44/platform-tools"
          tar -xjf "$RUNNER_TEMP/sdk.tar.bz2" -C "$HOME/.cache/solana/v1.44/platform-tools"
          python -B tooling/reconstruction/toolchain/bootstrap.py --sdk-check full
      - name: Fetch locked dependencies for both source revisions
        run: |
          export RUSTC="$HOME/.cache/pumpfun-reconstruction/toolchains/hybrid144/rust/bin/rustc"
          export CARGO_HOME="$HOME/.cargo"
          "$HOME/.cache/solana/v1.44/platform-tools/rust/bin/cargo" fetch --locked --manifest-path baseline/programs/pump/Cargo.toml
          "$HOME/.cache/solana/v1.44/platform-tools/rust/bin/cargo" fetch --locked --manifest-path candidate/programs/pump/Cargo.toml
      - name: Build and compare with one scorer and isolated cold targets
        run: >-
          python -B tooling/reconstruction/harness/build_score_pair.py
          --base baseline --candidate candidate --out "$RUNNER_TEMP/pump-score-pair"
      - name: Retain measurements and compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pump-score-pair
          path: |
            ${{ runner.temp }}/pump-score-pair/receipt.json
            ${{ runner.temp }}/pump-score-pair/*-score.json
            ${{ runner.temp }}/pump-score-pair/base/build.log
            ${{ runner.temp }}/pump-score-pair/candidate/build.log
          if-no-files-found: warn
